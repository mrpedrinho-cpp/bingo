<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bingo</title>
        <link rel="stylesheet" href="css/game.css">
    </head>
    <body>
        <nav>
            <h1><span class="vermelho">B</span><span class="amarelo">I</span><span class="verde">N</span><span class="azul">G</span><span class="roxo">O</span></h1>
            <div class="sorteio">
                <div class="ultimo-numero">
                    <p>ULTIMO<br>NÚMERO</p>
                    <span id="ultimo-numero">00</span>
                </div>
                <div class="numeros-sorteados">
                    <p>NÚMEROS SORTEADOS</p>
                    <div class="numeros-bolas">
                        <span class="numero-bola" id="numero-bola-1">00</span>
                        <span class="numero-bola" id="numero-bola-2">00</span>
                        <span class="numero-bola" id="numero-bola-3">00</span>
                        <span class="numero-bola" id="numero-bola-4">00</span>
                        <span class="numero-bola" id="numero-bola-5">00</span>
                        <span class="numero-bola" id="numero-bola-6">00</span>
                    </div>
                </div>
            </div>
            <div class="restantes">
                <div class="texto">
                    <p>NÚMEROS RESTANTES</p>
                </div>
                <div class="numero-restante">
                    <p id="numeros-restante">98</p>
                <img src="imgs/bingo.png" alt="Bingo" class="img-bingo">
                </div>
            </div>
        </nav>
        <main>
            <div class="cartelas">
                <h2 id="suas-cartelas">SUAS CARTELAS</h2>
                <div id="cartelas"></div>
            </div>
            <div class="jogadores">
                <h2>Jogadores</h2>
                <ul id="lista-jogadores">
                    
                </ul>
            </div>
        </main>
        <button class="bingo" onclick="bingo()">BINGO!</button>






        <script src="scripts/game.js"></script>
    </body>
</html>
